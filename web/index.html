<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Kairos smart calendar and schedule allocation assistant.">
  <meta name="theme-color" content="#2563EB">

  <!-- iOS meta tags & icons for Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kairos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon-precomposed" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kairos - Smart Calendar</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Hard refresh helper to completely clear service workers, cache storage, and reload
    window.kairosHardReload = async function() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
        }
        if ('caches' in window) {
          const cacheKeys = await caches.keys();
          for (const key of cacheKeys) {
            await caches.delete(key);
          }
        }
      } catch (err) {
        console.error("Hard reload error:", err);
      }
      window.location.reload(true);
    };

    window.kairosShowNotification = function(title, body) {
      try {
        if (!("Notification" in window)) return false;
        if (Notification.permission === "granted") {
          new Notification(title, {
            body: body,
            icon: "icons/Icon-192.png",
            badge: "favicon.png"
          });
          return true;
        }
      } catch (e) {
        console.error("Kairos notification error:", e);
      }
      return false;
    };

    window.kairosRequestPermission = function() {
      try {
        if (!("Notification" in window)) return Promise.resolve("unsupported");
        return Notification.requestPermission();
      } catch (e) {
        return Promise.resolve("error");
      }
    };

    window.kairosGetPermission = function() {
      if (!("Notification" in window)) return "unsupported";
      return Notification.permission;
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
