name: kairos
description: Kairos smart calendar app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Local persistence
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # Navigation
  go_router: ^12.1.1

  # Utilities
  uuid: ^4.1.0
  intl: ^0.18.1
  collection: ^1.18.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.20.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  linux: true
  linux_icon_name: "kairos"